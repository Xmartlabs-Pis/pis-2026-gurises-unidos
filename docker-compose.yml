services:
  web:
    # la imagen la buildea GitHub Actions y la publica en GHCR; la VM solo la baja
    image: ghcr.io/xmartlabs/pis-2026-gurises-unidos:${TAG:-main}
    ports:
      - '${PORT:-3000}:3000'
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    env_file: .env
    environment:
      POSTGRES_DB: app
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d app']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
